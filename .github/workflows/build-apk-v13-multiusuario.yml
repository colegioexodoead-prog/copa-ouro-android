name: Gerar APK Copa Ouro v1.3.2 Senha Salva e Icone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android v1.3.2
        shell: bash
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CopaOuroAndroidV132'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/copaouro/app/v13 app/src/main/res/values app/src/main/res/drawable app/src/main/assets/www
          cp v13/MainActivity.java app/src/main/java/com/copaouro/app/v13/MainActivity.java
          cp v13/profile-manager-v13.js app/src/main/assets/www/profile-manager-v13.js
          cp v13/cloud-sync-v13.js app/src/main/assets/www/cloud-sync-v13.js
          cp v13/index.html app/src/main/assets/www/index.html
          cp seed/seed-v12.json.gz.b64 app/src/main/assets/seed-v13.json.gz.b64
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.copaouro.app.v13'
            compileSdk 35
            defaultConfig {
              applicationId 'com.copaouro.app.v132'
              minSdk 24
              targetSdk 35
              versionCode 15
              versionName '1.3.2'
            }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Copa Ouro 1.3.2</string></resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#D4AF37</item><item name="android:navigationBarColor">#07150D</item><item name="android:statusBarColor">#07150D</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/copa_ouro_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#063E23" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F4C84A" android:strokeWidth="3" android:pathData="M8,5h92c2,0 3,1 3,3v92c0,2 -1,3 -3,3h-92c-2,0 -3,-1 -3,-3v-92c0,-2 1,-3 3,-3z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F7D75F" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M31,29C18,25 14,35 18,45C21,52 28,56 36,52"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F7D75F" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M77,29C90,25 94,35 90,45C87,52 80,56 72,52"/>
            <path android:fillColor="#D9A928" android:pathData="M27,22h54l-4,27C75,62 66,70 54,70C42,70 33,62 31,49z"/>
            <path android:fillColor="#FFE27A" android:pathData="M29,22h50v7h-50z"/>
            <path android:fillColor="#B78616" android:pathData="M34,32h40l-3,16C69,58 63,63 54,63C45,63 39,58 37,48z"/>
            <path android:fillColor="#F6C945" android:pathData="M50,67h8l2,12h-12z"/>
            <path android:fillColor="#FFE27A" android:pathData="M43,78h22v6h-22z"/>
            <path android:fillColor="#D7A31D" android:pathData="M35,84h38v7h-38z"/>
            <path android:fillColor="#F7D75F" android:pathData="M29,91h50v7h-50z"/>
            <path android:fillColor="#F6C945" android:pathData="M54,34l6,4l-2,7h-8l-2,-7z"/>
            <path android:fillColor="#6B4A08" android:pathData="M54,38l2,1l-1,3h-3l-1,-3z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#E7B62D" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M43,37C39,40 37,44 37,48M65,37C69,40 71,44 71,48"/>
          </vector>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:theme="@style/AppTheme" android:label="Copa Ouro 1.3.2" android:icon="@drawable/copa_ouro_icon" android:roundIcon="@drawable/copa_ouro_icon" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name="com.copaouro.app.v13.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Baixar modulos da Copa Ouro
        shell: bash
        run: |
          set -e
          cd app/src/main/assets/www
          wget -q --recursive --level=5 --no-parent --no-host-directories --reject="*.map" \
            https://ourocopa.netlify.app/copa/ \
            https://ourocopa.netlify.app/eliminatorias/ \
            https://ourocopa.netlify.app/mercado/ \
            https://ourocopa.netlify.app/galeria/ || true
          test -f copa/index.html
          test -f eliminatorias/index.html
          test -f mercado/index.html
          test -f galeria/index.html

      - name: Injetar perfis e sincronizacao
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets/www')
          for p in root.rglob('*.html'):
              if p==root/'index.html':
                  continue
              s=p.read_text(errors='ignore')
              for old in ['<script src="/sync-bridge.js"></script>','<script src="sync-bridge.js"></script>','<script src="/online-sync-bridge.js"></script>']:
                  s=s.replace(old,'')
              if 'profile-manager-v13.js' not in s:
                  if '<head>' in s:
                      s=s.replace('<head>','<head><script src="/profile-manager-v13.js"></script>',1)
                  else:
                      s='<script src="/profile-manager-v13.js"></script>'+s
              if 'cloud-sync-v13.js' not in s:
                  if '</body>' in s:
                      s=s.replace('</body>','<script src="/cloud-sync-v13.js"></script></body>')
                  else:
                      s += '<script src="/cloud-sync-v13.js"></script>'
              p.write_text(s)
          PY

      - name: Validar usuarios senha salva icone backup e seed
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          obj=json.loads(gzip.decompress(base64.b64decode(Path('app/src/main/assets/seed-v13.json.gz.b64').read_text().strip())))
          src=obj.get('local') or obj.get('remote') or {}
          required={'elimCopaOuro','copaOuroQualified','copaOuroTeamDraft','copa-ouro-edicoes-v1','copaOuroMercadoV2'}
          assert required.issubset(src), sorted(src)
          java=Path('app/src/main/java/com/copaouro/app/v13/MainActivity.java').read_text()
          home=Path('app/src/main/assets/www/index.html').read_text()
          cloud=Path('app/src/main/assets/www/cloud-sync-v13.js').read_text()
          profile=Path('app/src/main/assets/www/profile-manager-v13.js').read_text()
          gradle=Path('app/build.gradle').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          icon=Path('app/src/main/res/drawable/copa_ouro_icon.xml').read_text()
          assert 'package com.copaouro.app.v13;' in java
          assert 'copaProfile:pedro:' in java
          assert "applicationId 'com.copaouro.app.v132'" in gradle
          assert home.index('Pedro Henrique') < home.index('Maju') < home.index('Convidado')
          assert 'RECOVERY_HASH' in home and 'recoverPassword' in home
          assert 'GOLDEPLACA' not in home
          assert 'rememberPass' in home and 'Salvar senha neste aparelho' in home
          assert 'copaRememberV132:' in home and 'copaSavedPasswordV132:' in home
          assert 'copaRememberV132:' in profile and 'copaSavedPasswordV132:' in profile
          assert "activate('guest','Convidado')" in home
          assert 'copaProfileStateV13_' in cloud
          assert 'copaMenuToggle' in profile
          assert '@drawable/copa_ouro_icon' in manifest
          assert '#063E23' in icon and '#F4C84A' in icon
          print('SEED_PEDRO_KEYS',sorted(src))
          print('VALIDACAO_V132_OK')
          PY

      - name: Compilar APK v1.3.2
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar APK final
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/profile-manager-v13.js'
          unzip -l "$APK" | grep -q 'assets/www/cloud-sync-v13.js'
          unzip -l "$APK" | grep -q 'assets/seed-v13.json.gz.b64'
          unzip -l "$APK" | grep -q 'res/'
          mkdir -p dist
          cp "$APK" dist/Copa-Ouro-v1.3.2-Senha-Salva-Icone-Taca.apk
          sha256sum dist/Copa-Ouro-v1.3.2-Senha-Salva-Icone-Taca.apk

      - name: Publicar APK v1.3.2
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Ouro-APK-v1.3.2-SENHA-ICONE
          path: dist/Copa-Ouro-v1.3.2-Senha-Salva-Icone-Taca.apk
          retention-days: 30
