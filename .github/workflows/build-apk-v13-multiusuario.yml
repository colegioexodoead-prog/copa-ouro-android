name: Gerar APK Copa Ouro v1.3.1 Multiusuario

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android v1.3.1
        shell: bash
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CopaOuroAndroidV131'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/copaouro/app/v13 app/src/main/res/values app/src/main/assets/www
          cp v13/MainActivity.java app/src/main/java/com/copaouro/app/v13/MainActivity.java
          cp v13/profile-manager-v13.js app/src/main/assets/www/profile-manager-v13.js
          cp v13/cloud-sync-v13.js app/src/main/assets/www/cloud-sync-v13.js
          cp v13/index.html app/src/main/assets/www/index.html
          cp seed/seed-v12.json.gz.b64 app/src/main/assets/seed-v13.json.gz.b64
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.copaouro.app.v13'
            compileSdk 35
            defaultConfig {
              applicationId 'com.copaouro.app.v13'
              minSdk 24
              targetSdk 35
              versionCode 14
              versionName '1.3.1'
            }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Copa Ouro 1.3.1</string></resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#D4AF37</item><item name="android:navigationBarColor">#07150D</item><item name="android:statusBarColor">#07150D</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:theme="@style/AppTheme" android:label="Copa Ouro 1.3.1" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name="com.copaouro.app.v13.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Baixar modulos da Copa Ouro
        shell: bash
        run: |
          set -e
          cd app/src/main/assets/www
          wget -q --recursive --level=5 --no-parent --no-host-directories --reject="*.map" \
            https://ourocopa.netlify.app/copa/ \
            https://ourocopa.netlify.app/eliminatorias/ \
            https://ourocopa.netlify.app/mercado/ \
            https://ourocopa.netlify.app/galeria/ || true
          test -f copa/index.html
          test -f eliminatorias/index.html
          test -f mercado/index.html
          test -f galeria/index.html

      - name: Injetar perfis e sincronizacao
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets/www')
          for p in root.rglob('*.html'):
              if p==root/'index.html':
                  continue
              s=p.read_text(errors='ignore')
              for old in ['<script src="/sync-bridge.js"></script>','<script src="sync-bridge.js"></script>','<script src="/online-sync-bridge.js"></script>']:
                  s=s.replace(old,'')
              if 'profile-manager-v13.js' not in s:
                  if '<head>' in s:
                      s=s.replace('<head>','<head><script src="/profile-manager-v13.js"></script>',1)
                  else:
                      s='<script src="/profile-manager-v13.js"></script>'+s
              if 'cloud-sync-v13.js' not in s:
                  if '</body>' in s:
                      s=s.replace('</body>','<script src="/cloud-sync-v13.js"></script></body>')
                  else:
                      s += '<script src="/cloud-sync-v13.js"></script>'
              p.write_text(s)
          PY

      - name: Validar usuarios recuperacao backup e seed
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          obj=json.loads(gzip.decompress(base64.b64decode(Path('app/src/main/assets/seed-v13.json.gz.b64').read_text().strip())))
          src=obj.get('local') or obj.get('remote') or {}
          required={'elimCopaOuro','copaOuroQualified','copaOuroTeamDraft','copa-ouro-edicoes-v1','copaOuroMercadoV2'}
          assert required.issubset(src), sorted(src)
          java=Path('app/src/main/java/com/copaouro/app/v13/MainActivity.java').read_text()
          home=Path('app/src/main/assets/www/index.html').read_text()
          cloud=Path('app/src/main/assets/www/cloud-sync-v13.js').read_text()
          profile=Path('app/src/main/assets/www/profile-manager-v13.js').read_text()
          assert 'package com.copaouro.app.v13;' in java
          assert 'copaProfile:pedro:' in java
          assert home.index('Pedro Henrique') < home.index('Maju') < home.index('Convidado')
          assert 'RECOVERY_HASH' in home and 'recoverPassword' in home
          assert 'GOLDEPLACA' not in home
          assert 'copaLoginHashV131:' in home
          assert "activate('guest','Convidado')" in home
          assert 'copaProfileStateV13_' in cloud
          assert 'copaMenuToggle' in profile
          assert 'Salvar backup' in profile and 'Carregar backup' in profile and 'Início' in profile and 'Sair' in profile
          print('SEED_PEDRO_KEYS',sorted(src))
          print('VALIDACAO_V131_OK')
          PY

      - name: Compilar APK v1.3.1
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar APK final
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/profile-manager-v13.js'
          unzip -l "$APK" | grep -q 'assets/www/cloud-sync-v13.js'
          unzip -l "$APK" | grep -q 'assets/seed-v13.json.gz.b64'
          mkdir -p dist
          cp "$APK" dist/Copa-Ouro-v1.3.1-Usuarios-Recuperacao-Menu.apk
          sha256sum dist/Copa-Ouro-v1.3.1-Usuarios-Recuperacao-Menu.apk

      - name: Publicar APK v1.3.1
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Ouro-APK-v1.3.1-CORRIGIDO
          path: dist/Copa-Ouro-v1.3.1-Usuarios-Recuperacao-Menu.apk
          retention-days: 30
