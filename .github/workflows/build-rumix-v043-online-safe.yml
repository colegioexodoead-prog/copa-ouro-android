name: Gerar Rumi Mix Arena v0.4.3 ONLINE SAFE
on:
  push:
    branches: [ "rumix-online-v043-safe" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35 e ferramentas
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar, assinar e validar ONLINE SAFE
        run: bash rumix-v043/build-rumix-v043-online-safe.sh

      - name: Publicar ZIP e APK
        uses: actions/upload-artifact@v4
        with:
          name: RumiMixArena-v0.4.3-ONLINE-SAFE
          path: |
            dist/RumiMixArena-v0.4.3-ONLINE-SAFE.zip
            dist/RumiMixArena-v0.4.3-ONLINE-SAFE.apk
            dist/SHA256.txt
            dist/ASSINATURA.txt
            dist/APK-INFO.txt
            dist/PERMISSOES.txt
            dist/LEIA-ME.txt
