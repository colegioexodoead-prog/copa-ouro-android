name: Gerar APK Copa Ouro v1.3.6 Sequencia Automatica

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar projeto Android v1.3.6
        shell: bash
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CopaOuroV136'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/copaouro/app/v13 app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/assets/www
          cp v13/MainActivity.java app/src/main/java/com/copaouro/app/v13/MainActivity.java
          cp v13/profile-manager-v13.js app/src/main/assets/www/profile-manager-v13.js
          cp v13/cloud-sync-v13.js app/src/main/assets/www/cloud-sync-v13.js
          cp v13/navigation-v135.js app/src/main/assets/www/navigation-v135.js
          cp v13/edition-automation-v136.js app/src/main/assets/www/edition-automation-v136.js
          cp v13/index.html app/src/main/assets/www/index.html
          cp seed/seed-v12.json.gz.b64 app/src/main/assets/seed-v13.json.gz.b64
          node --check app/src/main/assets/www/edition-automation-v136.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts=sorted(Path('v13/icon-parts').glob('part*.hex'))
          assert len(parts)==12
          raw=bytes.fromhex(''.join(p.read_text().strip() for p in parts))
          sha=hashlib.sha256(raw).hexdigest()
          assert len(raw)==5811
          assert sha=='38baa84623daa5c1caf912b028259ea1f2ca85205a150e0a0f0998bc40daf742'
          Path('app/src/main/res/drawable-nodpi/copa_ouro_icon_photo.jpg').write_bytes(raw)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/www/index.html')
          s=p.read_text()
          s=s.replace('Copa Ouro 1.3.3','Copa Ouro 1.3.6').replace('Copa Ouro 1.3.5','Copa Ouro 1.3.6').replace('Android v1.3.3','Android v1.3.6').replace('Android v1.3.5','Android v1.3.6')
          if 'navigation-v135.js' not in s:s=s.replace('</body>','<script src="/navigation-v135.js"></script></body>')
          p.write_text(s)
          PY
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.copaouro.app.v13'
            compileSdk 35
            defaultConfig {
              applicationId 'com.copaouro.app.v136'
              minSdk 24
              targetSdk 35
              versionCode 19
              versionName '1.3.6'
            }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Copa Ouro 1.3.6</string></resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#D4AF37</item><item name="android:navigationBarColor">#07150D</item><item name="android:statusBarColor">#07150D</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:theme="@style/AppTheme" android:label="Copa Ouro 1.3.6" android:icon="@drawable/copa_ouro_icon_photo" android:roundIcon="@drawable/copa_ouro_icon_photo" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name="com.copaouro.app.v13.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Baixar modulos atuais
        shell: bash
        run: |
          set -e
          cd app/src/main/assets/www
          wget -q --recursive --level=5 --no-parent --no-host-directories --reject="*.map" \
            https://ourocopa.netlify.app/copa/ \
            https://ourocopa.netlify.app/eliminatorias/ \
            https://ourocopa.netlify.app/mercado/ \
            https://ourocopa.netlify.app/galeria/ || true
          test -f copa/index.html
          test -f eliminatorias/index.html
          test -f mercado/index.html
          test -f galeria/index.html

      - name: Injetar perfis nuvem navegacao e sequencia v1.3.6
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets/www')
          for p in root.rglob('*.html'):
              if p==root/'index.html': continue
              s=p.read_text(errors='ignore')
              for old in ['<script src="/sync-bridge.js"></script>','<script src="sync-bridge.js"></script>','<script src="/online-sync-bridge.js"></script>']:
                  s=s.replace(old,'')
              if 'profile-manager-v13.js' not in s:s=s.replace('<head>','<head><script src="/profile-manager-v13.js"></script>',1) if '<head>' in s else '<script src="/profile-manager-v13.js"></script>'+s
              if 'navigation-v135.js' not in s:s=s.replace('</body>','<script src="/navigation-v135.js"></script></body>') if '</body>' in s else s+'<script src="/navigation-v135.js"></script>'
              if p in [root/'copa/index.html',root/'eliminatorias/index.html'] and 'edition-automation-v136.js' not in s:
                  s=s.replace('</body>','<script src="/edition-automation-v136.js"></script></body>') if '</body>' in s else s+'<script src="/edition-automation-v136.js"></script>'
              if 'cloud-sync-v13.js' not in s:s=s.replace('</body>','<script src="/cloud-sync-v13.js"></script></body>') if '</body>' in s else s+'<script src="/cloud-sync-v13.js"></script>'
              p.write_text(s)
          PY

      - name: Validar automacao de sequencia e dados
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,json
          root=Path('app/src/main/assets/www')
          home=(root/'index.html').read_text()
          copa=(root/'copa/index.html').read_text(errors='ignore')
          elim=(root/'eliminatorias/index.html').read_text(errors='ignore')
          auto=(root/'edition-automation-v136.js').read_text()
          nav=(root/'navigation-v135.js').read_text()
          seed=json.loads(gzip.decompress(base64.b64decode(Path('app/src/main/assets/seed-v13.json.gz.b64').read_text().strip())))
          data=seed.get('local') or seed.get('remote') or {}
          required={'elimCopaOuro','copaOuroQualified','copaOuroTeamDraft','copa-ouro-edicoes-v1','copaOuroMercadoV2'}
          assert required.issubset(data)
          assert 'Salvar senha neste aparelho' in home
          assert 'edition-automation-v136.js' in copa
          assert 'edition-automation-v136.js' in elim
          assert 'finishAndStartNewCup' in copa and 'generatePlayoffs' in copa
          assert 'function addTeam' in elim and 'directSlot' in elim
          assert "'Inglaterra':[1,2,3,4]" in auto
          assert "next.slots[36]=champNew" in auto
          assert "status:'direct'" in auto and "status:'dispute'" in auto
          assert 'playoffWinners' in auto and 'table.slice(0,8)' in auto
          assert 'Finalizar Copa + Preparar Próximas Eliminatórias' in auto
          assert 'Vagas diretas automáticas' in auto
          assert 'archiveOldElimIfNeeded' in auto and 'autoFinalizedByCup' in auto
          assert 'copaSequenceV136' in auto
          assert "{key:'roleta'" not in nav
          assert 'Roleta dos Jogos' in nav and 'Array.from({length:18}' in nav
          assert 'id="roletaVagas"' in elim and 'Girar roleta' in elim
          print('VALIDACAO_V136_OK')
          PY

      - name: Compilar APK v1.3.6
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK final
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/www/edition-automation-v136.js'
          unzip -l "$APK" | grep -q 'assets/www/navigation-v135.js'
          unzip -l "$APK" | grep -q 'assets/www/copa/index.html'
          unzip -l "$APK" | grep -q 'assets/www/eliminatorias/index.html'
          unzip -l "$APK" | grep -q 'assets/seed-v13.json.gz.b64'
          mkdir -p dist
          cp "$APK" dist/Copa-Ouro-v1.3.6-Sequencia-Automatica.apk
          sha256sum dist/Copa-Ouro-v1.3.6-Sequencia-Automatica.apk

      - name: Publicar APK v1.3.6
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Ouro-v1.3.6-Sequencia-Automatica
          path: dist/Copa-Ouro-v1.3.6-Sequencia-Automatica.apk
          retention-days: 30
