name: Gerar APK Mega Karaoke V12 Easy UI

on:
  push:
    branches: [ mega-karaoke-apk-v12-easy-ui ]
    paths:
      - 'karaoke-v12/**'
      - '.github/workflows/build-mega-karaoke-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar V11 e aplicar interface V12
        run: |
          rm -rf karaoke-v12/src /tmp/v11src
          mkdir -p karaoke-v12/src /tmp/v11src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/base.b64
          base64 -d /tmp/base.b64 > /tmp/base.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d karaoke-v12/src
          cat karaoke-v11/chunks/chunk_00 karaoke-v11/chunks/chunk_01 karaoke-v11/chunks/chunk_02 karaoke-v11/chunks/chunk_03 > /tmp/v11.b64
          base64 -d /tmp/v11.b64 > /tmp/v11.tar.xz
          echo "64cc13c2490654945ac8b86ebcd2917cb1d8991af7f6d343ce4c938baef16538  /tmp/v11.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v11.tar.xz -C /tmp/v11src
          cp /tmp/v11src/java/*.java karaoke-v12/src/android/app/src/main/java/com/megakaraoke/app/
          cp karaoke-v12/overrides/EmbeddedLibraryActivity.java karaoke-v12/src/android/app/src/main/java/com/megakaraoke/app/EmbeddedLibraryActivity.java
          python3 - <<'PY'
          from pathlib import Path
          j=Path('karaoke-v12/src/android/app/src/main/java/com/megakaraoke/app/KaraokePlayerActivity.java')
          s=j.read_text(encoding='utf-8')
          s=s.replace(r'\p{L}',r'\\p{L}').replace(r'\p{N}',r'\\p{N}')
          s=s.replace('ts.mediaTimeUs','ts.getAnchorMediaTimeUs()').replace('ts.clockRate','ts.getMediaClockRate()').replace('ts.nanoTime','ts.getAnchorSytemNanoTime()')
          s=s.replace('previousLine=lyricText(23,Color.rgb(123,116,145),false);currentLine=lyricText(33,Color.WHITE,true);nextLine=lyricText(24,Color.rgb(166,157,185),false);','previousLine=lyricText(20,Color.rgb(123,116,145),false);currentLine=lyricText(36,Color.WHITE,true);nextLine=lyricText(23,Color.rgb(166,157,185),false);')
          s=s.replace('Button earlier=button("◀ Letra antes",12);Button later=button("Letra depois ▶",12);syncView=text("SYNC AUTO",11,Color.rgb(194,185,218),true);','Button earlier=button("−0,1 s",13);Button later=button("+0,1 s",13);syncView=text("AUTO",12,Color.rgb(255,216,78),true);')
          s=s.replace('pitchView=text("Afinador aguardando o microfone...",12,Color.rgb(196,187,216),true);','pitchView=text("Afinador aguardando o microfone...",13,Color.rgb(196,187,216),true);')
          s=s.replace('countdown=text("PREPARE-SE",20,Color.rgb(211,190,255),true);','countdown=text("PREPARE-SE",22,Color.rgb(211,190,255),true);')
          j.write_text(s,encoding='utf-8')
          a=Path('karaoke-v12/src/android/app/src/main/java/com/megakaraoke/app/AvatarActivity.java')
          x=a.read_text(encoding='utf-8').replace('grid.setColumnCount(5)','grid.setColumnCount(4)').replace('lp.height=dp(64)','lp.height=dp(70)')
          a.write_text(x,encoding='utf-8')
          p=Path('karaoke-v12/src/android/app/src/main/AndroidManifest.xml')
          m=p.read_text(encoding='utf-8')
          old='''        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          new='''        <activity android:name=".AvatarActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".RankingActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".PlayersActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".KaraokePlayerActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".EmbeddedLibraryActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert old in m
          p.write_text(m.replace(old,new),encoding='utf-8')
          g=Path('karaoke-v12/src/android/app/build.gradle.kts')
          z=g.read_text(encoding='utf-8').replace('applicationId = "com.megakaraoke.app"','applicationId = "com.megakaraoke.v12easy"').replace('versionCode = 6','versionCode = 14').replace('versionName = "5.1-licensed-library"','versionName = "12.0-easy-ui"')
          g.write_text(z,encoding='utf-8')
          PY
      - name: Compilar APK base
        working-directory: karaoke-v12/src/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar e preparar APK
        run: |
          APK=karaoke-v12/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v12/Mega-Karaoke-V12-BASE.apk
          sha256sum karaoke-v12/Mega-Karaoke-V12-BASE.apk > karaoke-v12/SHA256-V12-BASE.txt
      - name: Publicar APK base
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V12-BASE
          path: |
            karaoke-v12/Mega-Karaoke-V12-BASE.apk
            karaoke-v12/SHA256-V12-BASE.txt
          retention-days: 30
