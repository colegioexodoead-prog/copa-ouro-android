name: Gerar APK Rumi Mix Arena v0.4
on:
  push:
    branches: [ "rumix-online-v04" ]
    paths-ignore:
      - "downloads/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35 e ferramentas de assinatura
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar e validar APK
        run: bash rumix-v04/build-rumix-v04.sh

      - name: Publicar APK validado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Rumi-Mix-Arena-v0.4.0-LAYOUT-MELHORADO
          path: |
            dist/Rumi-Mix-Arena-v0.4.0.apk
            dist/Rumi-Mix-Arena-v0.4.0-SHA256.txt

      - name: Publicar APK em link publico no GitHub
        run: |
          mkdir -p downloads
          cp dist/Rumi-Mix-Arena-v0.4.0.apk downloads/RumiMixArena-v0.4.0.apk
          cp dist/Rumi-Mix-Arena-v0.4.0-SHA256.txt downloads/RumiMixArena-v0.4.0-SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/RumiMixArena-v0.4.0.apk downloads/RumiMixArena-v0.4.0-SHA256.txt
          if git diff --cached --quiet; then
            echo "APK publico ja esta atualizado."
          else
            git commit -m "Publicar APK Rumi Mix Arena v0.4 [skip ci]"
            git push origin HEAD:rumix-online-v04
          fi
