name: Gerar APK Rumi Mix Arena v0.4
on:
  push:
    branches: [ "rumix-online-v04" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 35 e ferramentas de assinatura
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar e validar APK
        run: bash rumix-v04/build-rumix-v04.sh
      - name: Publicar APK validado
        uses: actions/upload-artifact@v4
        with:
          name: Rumi-Mix-Arena-v0.4.0-LAYOUT-MELHORADO
          path: |
            dist/Rumi-Mix-Arena-v0.4.0.apk
            dist/Rumi-Mix-Arena-v0.4.0-SHA256.txt
