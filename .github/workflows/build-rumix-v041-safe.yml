name: Gerar Rumi Mix Arena v0.4.1 SAFE
on:
  push:
    branches: [ "rumix-online-v041-security" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35 e ferramentas
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar, assinar e validar SAFE
        run: bash rumix-v041/build-rumix-v041-safe.sh

      - name: Publicar pacote SAFE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RumiMixArena-v0.4.1-SAFE
          path: |
            dist/RumiMixArena-v0.4.1-SAFE.zip
            dist/RumiMixArena-v0.4.1-SAFE.apk
            dist/SHA256.txt
            dist/ASSINATURA.txt
            dist/APK-INFO.txt
            dist/PERMISSOES.txt
            dist/LEIA-ME.txt

      - name: Publicar ZIP SAFE no GitHub
        run: |
          mkdir -p downloads-safe
          cp dist/RumiMixArena-v0.4.1-SAFE.zip downloads-safe/
          cp dist/SHA256.txt downloads-safe/RumiMixArena-v0.4.1-SAFE-SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-safe/
          git commit -m "Publicar ZIP Rumi Mix Arena v0.4.1 SAFE" || exit 0
          git push
