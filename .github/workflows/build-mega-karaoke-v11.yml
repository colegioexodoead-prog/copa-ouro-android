name: Gerar APK Mega Karaoke V11 Full Layout Sync

on:
  push:
    branches: [ mega-karaoke-apk-v11-full-layout-sync ]
    paths:
      - 'karaoke-v11/**'
      - '.github/workflows/build-mega-karaoke-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar base e aplicar V11
        run: |
          rm -rf karaoke-v11/src /tmp/v11src
          mkdir -p karaoke-v11/src /tmp/v11src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/mega-karaoke-v5.b64
          base64 -d /tmp/mega-karaoke-v5.b64 > /tmp/mega-karaoke-v5.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/mega-karaoke-v5.zip" | sha256sum -c -
          unzip -q /tmp/mega-karaoke-v5.zip -d karaoke-v11/src
          cat karaoke-v11/chunks/chunk_00 karaoke-v11/chunks/chunk_01 karaoke-v11/chunks/chunk_02 karaoke-v11/chunks/chunk_03 > /tmp/v11java.tar.xz.b64
          base64 -d /tmp/v11java.tar.xz.b64 > /tmp/v11java.tar.xz
          echo "64cc13c2490654945ac8b86ebcd2917cb1d8991af7f6d343ce4c938baef16538  /tmp/v11java.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v11java.tar.xz -C /tmp/v11src
          cp /tmp/v11src/java/*.java karaoke-v11/src/android/app/src/main/java/com/megakaraoke/app/
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('karaoke-v11/src/android/app/src/main/java/com/megakaraoke/app/KaraokePlayerActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace(r'\p{L}', r'\\p{L}').replace(r'\p{N}', r'\\p{N}')
          s=s.replace('ts.mediaTimeUs','ts.getAnchorMediaTimeUs()')
          s=s.replace('ts.clockRate','ts.getMediaClockRate()')
          s=s.replace('ts.nanoTime','ts.getAnchorSytemNanoTime()')
          p.write_text(s,encoding='utf-8')
          PYFIX
          python3 - <<'PY'
          from pathlib import Path
          p=Path('karaoke-v11/src/android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          old='''        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          new='''        <activity android:name=".AvatarActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".RankingActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".PlayersActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".KaraokePlayerActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".EmbeddedLibraryActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('karaoke-v11/src/android/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('applicationId = "com.megakaraoke.app"','applicationId = "com.megakaraoke.v11complete"')
          s=s.replace('versionCode = 6','versionCode = 13')
          s=s.replace('versionName = "5.1-licensed-library"','versionName = "11.0-full-layout-sync"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compilar APK base
        working-directory: karaoke-v11/src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK
        run: |
          APK=karaoke-v11/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v11/Mega-Karaoke-V11-BASE.apk
          sha256sum karaoke-v11/Mega-Karaoke-V11-BASE.apk > karaoke-v11/SHA256-V11-BASE.txt

      - name: Publicar APK base
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V11-BASE
          path: |
            karaoke-v11/Mega-Karaoke-V11-BASE.apk
            karaoke-v11/SHA256-V11-BASE.txt
          retention-days: 30
