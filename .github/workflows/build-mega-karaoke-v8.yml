name: Gerar APK Mega Karaoke V8 Integrado

on:
  push:
    branches: [ mega-karaoke-apk-v8-integrado ]
    paths:
      - 'karaoke-v8/**'
      - '.github/workflows/build-mega-karaoke-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar base V5 e aplicar V8 integrada
        run: |
          rm -rf karaoke-v8/src /tmp/v8src
          mkdir -p karaoke-v8/src /tmp/v8src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/mega-karaoke-v5.b64
          base64 -d /tmp/mega-karaoke-v5.b64 > /tmp/mega-karaoke-v5.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/mega-karaoke-v5.zip" | sha256sum -c -
          unzip -q /tmp/mega-karaoke-v5.zip -d karaoke-v8/src
          base64 -d karaoke-v7/v7java.tar.xz.b64 > /tmp/v8java.tar.xz
          echo "fd972189b13197cf2951f66dc16da31d6568efe84917a95ff5e2c233040870c8  /tmp/v8java.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v8java.tar.xz -C /tmp/v8src
          cp /tmp/v8src/java/*.java karaoke-v8/src/android/app/src/main/java/com/megakaraoke/app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('karaoke-v8/src/android/app/src/main/java/com/megakaraoke/app/EmbeddedLibraryActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('TextView back=text("‹  Voltar",18,Color.WHITE,true);back.setPadding(0,dp(4),0,dp(8));back.setOnClickListener(v->finish());root.addView(back,new LinearLayout.LayoutParams(-1,-2));','')
          s=s.replace('root.addView(text("🎤 Biblioteca Interna",28,Color.WHITE,true));TextView sub=text("Escolha seu jogador, cante, pontue e suba no ranking",14,Color.rgb(198,190,220),false);', 'root.addView(text("🎤 MEGA KARAOKÊ",28,Color.WHITE,true));TextView sub=text("Músicas internas, jogadores, pontuação e ranking em um só lugar",14,Color.rgb(198,190,220),false);')
          s=s.replace('status.setText(all.size()+" karaokês prontos · escolha uma música para cantar")','status.setText(all.size()+" músicas internas prontas · escolha uma para cantar")')
          s=s.replace('status.setText(shown.size()+" resultado(s) · "+all.size()+" karaokês no APK")','status.setText(shown.size()+" resultado(s) · "+all.size()+" músicas no Mega Karaokê")')
          p.write_text(s,encoding='utf-8')

          p=Path('karaoke-v8/src/android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          old='''        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          new='''        <activity android:name=".RankingActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".PlayersActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".KaraokePlayerActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".EmbeddedLibraryActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('karaoke-v8/src/android/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('applicationId = "com.megakaraoke.app"','applicationId = "com.megakaraoke.v8integrado"')
          s=s.replace('versionCode = 6','versionCode = 10')
          s=s.replace('versionName = "5.1-licensed-library"','versionName = "8.0-integrado"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compilar APK base
        working-directory: karaoke-v8/src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK
        run: |
          APK=karaoke-v8/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v8/Mega-Karaoke-V8-BASE.apk
          sha256sum karaoke-v8/Mega-Karaoke-V8-BASE.apk > karaoke-v8/SHA256-V8-BASE.txt

      - name: Publicar APK base
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V8-BASE
          path: |
            karaoke-v8/Mega-Karaoke-V8-BASE.apk
            karaoke-v8/SHA256-V8-BASE.txt
          retention-days: 30
