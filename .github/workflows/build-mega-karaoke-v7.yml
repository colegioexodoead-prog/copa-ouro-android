name: Gerar APK Mega Karaoke V7

on:
  push:
    branches: [ mega-karaoke-apk-v7-build ]
    paths:
      - 'karaoke-v7/**'
      - '.github/workflows/build-mega-karaoke-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar base e aplicar V7
        run: |
          rm -rf karaoke-v7/src /tmp/v7src
          mkdir -p karaoke-v7/src /tmp/v7src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/mega-karaoke-v5.b64
          base64 -d /tmp/mega-karaoke-v5.b64 > /tmp/mega-karaoke-v5.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/mega-karaoke-v5.zip" | sha256sum -c -
          unzip -q /tmp/mega-karaoke-v5.zip -d karaoke-v7/src
          base64 -d karaoke-v7/v7java.tar.xz.b64 > /tmp/v7java.tar.xz
          echo "fd972189b13197cf2951f66dc16da31d6568efe84917a95ff5e2c233040870c8  /tmp/v7java.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v7java.tar.xz -C /tmp/v7src
          cp karaoke-v6/LauncherActivity.java karaoke-v7/src/android/app/src/main/java/com/megakaraoke/app/
          cp /tmp/v7src/java/*.java karaoke-v7/src/android/app/src/main/java/com/megakaraoke/app/
          python3 - <<'PY'
          p='karaoke-v7/src/android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          old='''        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          new='''        <activity android:name=".RankingActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".PlayersActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".KaraokePlayerActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".EmbeddedLibraryActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".LauncherActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert old in s
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          p='karaoke-v7/src/android/app/build.gradle.kts'
          s=open(p,encoding='utf-8').read()
          s=s.replace('applicationId = "com.megakaraoke.app"','applicationId = "com.megakaraoke.v7nacionais"')
          s=s.replace('versionCode = 6','versionCode = 9')
          s=s.replace('versionName = "5.1-licensed-library"','versionName = "7.0-players-ranking"')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Compilar APK base
        working-directory: karaoke-v7/src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK
        run: |
          APK=karaoke-v7/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v7/Mega-Karaoke-V7-BASE.apk
          sha256sum karaoke-v7/Mega-Karaoke-V7-BASE.apk > karaoke-v7/SHA256-V7-BASE.txt

      - name: Publicar APK base
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V7-BASE
          path: |
            karaoke-v7/Mega-Karaoke-V7-BASE.apk
            karaoke-v7/SHA256-V7-BASE.txt
          retention-days: 30
