name: Build Camuflagem Arena APK

on:
  push:
    branches:
      - camuflagem-arena-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: camuflagem-arena-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp camuflagem-arena-android/app/build/outputs/apk/debug/app-debug.apk Camuflagem-Arena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camuflagem-Arena-APK
          path: Camuflagem-Arena.apk
          if-no-files-found: error
          retention-days: 30
