name: Build Camuflagem Arena APK

on:
  push:
    branches:
      - camuflagem-arena-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf camuflagem-build
          mkdir camuflagem-build
          unzip -q Camuflagem-Arena-Android-Studio.zip -d camuflagem-build

      - name: Build APK
        working-directory: camuflagem-build/CamuflagemArenaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp camuflagem-build/CamuflagemArenaAndroid/app/build/outputs/apk/debug/app-debug.apk Camuflagem-Arena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camuflagem-Arena-APK
          path: Camuflagem-Arena.apk
          if-no-files-found: error
          retention-days: 30
