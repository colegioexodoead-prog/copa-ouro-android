name: Gerar APK Mega Karaoke V5

on:
  push:
    branches: [ mega-karaoke-apk-v5-build ]
    paths:
      - 'karaoke-v5/**'
      - '.github/workflows/build-mega-karaoke-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar projeto Mega Karaoke V5
        run: |
          rm -rf karaoke-v5/src
          mkdir -p karaoke-v5/src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/mega-karaoke-v5.b64
          test "$(wc -c < /tmp/mega-karaoke-v5.b64 | tr -d ' ')" = "47744"
          base64 -d /tmp/mega-karaoke-v5.b64 > /tmp/mega-karaoke-v5.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/mega-karaoke-v5.zip" | sha256sum -c -
          unzip -q /tmp/mega-karaoke-v5.zip -d karaoke-v5/src
          test -f karaoke-v5/src/android/settings.gradle.kts

      - name: Compilar APK instalavel
        working-directory: karaoke-v5/src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK
        run: |
          APK=karaoke-v5/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v5/Mega-Karaoke-V5.apk
          sha256sum karaoke-v5/Mega-Karaoke-V5.apk > karaoke-v5/SHA256-Mega-Karaoke-V5.txt
          ls -lh karaoke-v5/Mega-Karaoke-V5.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V5-APK
          path: |
            karaoke-v5/Mega-Karaoke-V5.apk
            karaoke-v5/SHA256-Mega-Karaoke-V5.txt
          retention-days: 30
