name: Build RedeCanais APK

on:
  push:
    branches: [ build-redecanais-apk-20260915 ]
    paths:
      - 'redecanais-app/**'
      - '.github/workflows/build-redecanais-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: redecanais-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp redecanais-app/app/build/outputs/apk/debug/app-debug.apk out/RedeCanais.apk
          sha256sum out/RedeCanais.apk > out/SHA256.txt
          test -s out/RedeCanais.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedeCanais-APK
          path: |
            out/RedeCanais.apk
            out/SHA256.txt
          retention-days: 7
