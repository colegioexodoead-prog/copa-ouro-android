name: Compile v1.5 Drive DEX

on:
  push:
    branches: [ drive-v150 ]
    paths:
      - 'v15/MainActivity.java'
      - '.github/workflows/build-v150-drive-dex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile MainActivity to DEX
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if(r==DRIVE_CREATE)driveWriteAsync(""); else driveReadAsync();/if(r==DRIVE_OPEN)driveReadAsync();/' v15/MainActivity.java
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d out/classes v15/MainActivity.java
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          "$D8" --min-api 24 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output out/dex $(find out/classes -name '*.class' -print)
          test -s out/dex/classes.dex
          strings out/dex/classes.dex | grep -q 'driveCreate'
          strings out/dex/classes.dex | grep -q 'drivePut'
          if strings out/dex/classes.dex | grep -q 'ourocopa.netlify.app'; then exit 1; fi
          sha256sum out/dex/classes.dex > out/dex/SHA256-DEX.txt

      - name: Upload DEX
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Ouro-v1.5.0-Drive-DEX
          path: |
            out/dex/classes.dex
            out/dex/SHA256-DEX.txt
          retention-days: 7
