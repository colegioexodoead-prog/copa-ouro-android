name: Gerar APK Rumi Mix Online v0.1

on:
  push:
    branches: [ rumix-online-v01 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testar e compilar Rumi Mix v0.1
        run: bash rumix/build-rumix-v01.sh

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumi-Mix-Online-v0.1.0
          path: |
            dist/Rumi-Mix-Online-v0.1.0.apk
            dist/Rumi-Mix-Online-v0.1.0-SHA256.txt
          retention-days: 30
