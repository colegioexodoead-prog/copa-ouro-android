name: Gerar APK Copa Ouro v1.2 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar projeto v1.2
        run: |
          set -e
          cat template/v12parts/*.b64 > /tmp/v12-template.tar.gz.b64
          test "$(wc -c < /tmp/v12-template.tar.gz.b64)" -eq 36024
          echo "6c73cac5d9cc79c677ead020ec245ccd79b8eadb710412312d0b43415687c69c  /tmp/v12-template.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/v12-template.tar.gz.b64 > /tmp/v12-template.tar.gz
          gzip -t /tmp/v12-template.tar.gz
          tar -xzf /tmp/v12-template.tar.gz
          mkdir -p app/src/main/assets/www

      - name: Incorporar módulos da Copa Ouro
        run: |
          set -e
          cd app/src/main/assets/www
          wget -q --recursive --level=5 --no-parent --no-host-directories --reject="*.map" \
            https://ourocopa.netlify.app/ \
            https://ourocopa.netlify.app/copa/ \
            https://ourocopa.netlify.app/eliminatorias/ \
            https://ourocopa.netlify.app/mercado/ \
            https://ourocopa.netlify.app/galeria/ || true
          test -f copa/index.html
          test -f eliminatorias/index.html
          test -f mercado/index.html
          test -f galeria/index.html
          cd ../../../../../
          python3 tools/inject.py

      - name: Compilar APK release
        run: gradle :app:assembleRelease --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Copa-Ouro-v1.2-UNSIGNED.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Ouro-v1.2-UNSIGNED
          path: Copa-Ouro-v1.2-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30
