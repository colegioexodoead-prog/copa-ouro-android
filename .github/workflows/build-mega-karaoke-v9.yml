name: Gerar APK Mega Karaoke V9 Pitch Score

on:
  push:
    branches: [ mega-karaoke-apk-v9-pitchscore ]
    paths:
      - 'karaoke-v9/**'
      - '.github/workflows/build-mega-karaoke-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar base e aplicar V9
        run: |
          rm -rf karaoke-v9/src /tmp/v9src
          mkdir -p karaoke-v9/src /tmp/v9src
          cat karaoke-v5/chunks/chunk_00 karaoke-v5/chunks/chunk_01 karaoke-v5/chunks/chunk_02 karaoke-v5/chunks/chunk_03 > /tmp/mega-karaoke-v5.b64
          base64 -d /tmp/mega-karaoke-v5.b64 > /tmp/mega-karaoke-v5.zip
          echo "5cc5fd385d8beaad0e091c5a044ae8a93278ed818a9a1556c06536307f3d11bb  /tmp/mega-karaoke-v5.zip" | sha256sum -c -
          unzip -q /tmp/mega-karaoke-v5.zip -d karaoke-v9/src
          base64 -d karaoke-v9/v9java.tar.xz.b64 > /tmp/v9java.tar.xz
          echo "3bb87a63d1fbb90e8c8824c14d379ddfe42252d2de5d12b62e10e6fe5ddfe23d  /tmp/v9java.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v9java.tar.xz -C /tmp/v9src
          cp /tmp/v9src/java/*.java karaoke-v9/src/android/app/src/main/java/com/megakaraoke/app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('karaoke-v9/src/android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          old='''        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          new='''        <activity android:name=".RankingActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".PlayersActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".KaraokePlayerActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".VideoActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".SearchActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="false" />\n        <activity android:name=".EmbeddedLibraryActivity" android:screenOrientation="unspecified" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('karaoke-v9/src/android/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('applicationId = "com.megakaraoke.app"','applicationId = "com.megakaraoke.v9pitchscore"')
          s=s.replace('versionCode = 6','versionCode = 11')
          s=s.replace('versionName = "5.1-licensed-library"','versionName = "9.0-pitchscore"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compilar APK base
        working-directory: karaoke-v9/src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Validar e preparar APK
        run: |
          APK=karaoke-v9/src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          zipinfo -t "$APK"
          cp "$APK" karaoke-v9/Mega-Karaoke-V9-BASE.apk
          sha256sum karaoke-v9/Mega-Karaoke-V9-BASE.apk > karaoke-v9/SHA256-V9-BASE.txt

      - name: Publicar APK base
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karaoke-V9-BASE
          path: |
            karaoke-v9/Mega-Karaoke-V9-BASE.apk
            karaoke-v9/SHA256-V9-BASE.txt
          retention-days: 30
