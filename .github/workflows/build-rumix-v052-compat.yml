name: Gerar Rumi Mix Arena v0.5.2 COMPAT

on:
  push:
    branches:
      - rumix-online-v052-compat
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35 e ferramentas
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar e validar APK compatível
        run: bash rumix-v052/build-rumix-v052-compat.sh

      - name: Publicar APK e ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RumiMixArena-v0.5.2-COMPAT
          path: |
            dist/RumiMixArena-v0.5.2-COMPAT.apk
            dist/RumiMixArena-v0.5.2-COMPAT.zip
            dist/SHA256.txt
            dist/ASSINATURA.txt
            dist/APK-INFO.txt
            dist/PERMISSOES.txt
            dist/LEIA-ME.txt
