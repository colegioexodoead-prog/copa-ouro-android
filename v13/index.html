<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Copa Ouro 1.3</title><script src="/profile-manager-v13.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#04150b,#174329);color:#fff;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:22px}.brand{text-align:center}.star{font-size:48px;color:#e3bd42}.brand h1{margin:4px;color:#f1d16b}.muted{color:#b8cabb}.box{margin:20px auto;padding:18px;border:1px solid #9d812b;border-radius:18px;background:#0b2518}.field{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #597360;background:#07150d;color:#fff;font-size:16px}.btn{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:#d4af37;color:#0b2014;font-weight:800;font-size:15px}.btn.alt{background:#204d32;color:#fff;border:1px solid #6b8b75}.err{color:#ffb2a9;min-height:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.card{min-height:110px;border:1px solid #aa8a2a;background:#0d3020;border-radius:17px;color:#fff;padding:17px;font-weight:800;font-size:17px}.card b{display:block;font-size:27px;color:#e5bd3b;margin-bottom:8px}.full{grid-column:1/-1}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tools button{padding:10px;border:0;border-radius:9px;font-weight:800}.gold{background:#d4af37}.green{background:#326b47;color:#fff}a{text-decoration:none}</style></head><body><div class="wrap"><div class="brand"><div class="star">★</div><h1>COPA OURO</h1><div class="muted">Aplicativo Android v1.3 • perfis separados • backup • nuvem</div></div><div id="login" class="box" style="display:none"><h2>Acesso</h2><input id="user" class="field" placeholder="Usuario"><input id="pass" class="field" type="password" placeholder="Senha"><button class="btn" onclick="loginUser()">ENTRAR</button><button class="btn alt" onclick="guest()">ENTRAR COMO CONVIDADO</button><div id="err" class="err"></div><p class="small muted">Pedro Henrique e Maju possuem ambientes separados. Convidado inicia com a plataforma vazia.</p></div><div id="dash" style="display:none"><div class="box"><div class="topline"><div><b id="who"></b><div id="cloudStatus" class="small muted">☁️ Preparando salvamento online...</div></div><button onclick="CopaProfiles.logout()" class="btn alt" style="width:auto;margin:0">SAIR</button></div><div class="tools"><button class="gold" onclick="CopaProfiles.backup()">💾 SALVAR BACKUP</button><button class="green" onclick="CopaProfiles.loadFile()">📂 CARREGAR BACKUP</button></div><button class="btn alt" onclick="CopaCloudManualConnect()">☁️ CONECTAR NUVEM</button></div><div class="grid"><a href="/copa/"><div class="card"><b>🏆</b>Copa Ouro</div></a><a href="/eliminatorias/"><div class="card"><b>⚽</b>Eliminatorias</div></a><a href="/mercado/"><div class="card"><b>🔄</b>Mercado</div></a><a href="/galeria/"><div class="card"><b>👑</b>Galeria</div></a><a href="/copa/"><div class="card full"><b>🎯</b>Roleta / Jogos</div></a></div></div></div><script>
const PEDRO_HASH='da6252509b27ea1ef327712fb433a7bc15ec7033c2ff98e2a6760da4179547e7';
const MAJU_HASH='ea7bf58654f90acef86b186b6eb31672cd83419342000cf6e2194e63f9104e3e';
function norm(s){return(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
async function hashText(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function loginUser(){const u=norm(document.getElementById('user').value),p=document.getElementById('pass').value,h=await hashText(p);let id='',name='';if((u==='pedro henrique'||u==='pedro')&&h===PEDRO_HASH){id='pedro';name='Pedro Henrique'}else if(u==='maju'&&h===MAJU_HASH){id='maju';name='Maju'}else{document.getElementById('err').textContent='Usuario ou senha incorretos.';return}if(window.AndroidBridge&&AndroidBridge.cloudHasSession&&!AndroidBridge.cloudHasSession()&&AndroidBridge.cloudLogin)AndroidBridge.cloudLogin(p);CopaProfiles.activate(id,name);setTimeout(()=>location.reload(),100)}
function guest(){CopaProfiles.activate('guest','Convidado');location.reload()}
const a=CopaProfiles.active();if(a){document.getElementById('dash').style.display='block';document.getElementById('who').textContent='👤 '+CopaProfiles.pname()}else document.getElementById('login').style.display='block';
</script><script src="/cloud-sync-v13.js"></script></body></html>
