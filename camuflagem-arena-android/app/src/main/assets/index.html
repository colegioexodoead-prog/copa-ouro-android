<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Camuflagem Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.screen{min-height:100vh;padding:18px;max-width:900px;margin:auto;overflow:auto}.brand{font-size:26px;font-weight:900;margin-bottom:16px}.sub{color:#9db0c5;font-size:13px}.card{background:#10203a;border:1px solid #294361;border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode{min-height:125px}.mode h3{margin:6px 0}.icon{font-size:38px}.btn{width:100%;padding:14px;border:0;border-radius:14px;margin-top:10px;background:#44e2a8;color:#06130f;font-weight:900;font-size:15px}.btn.alt{background:#1a3151;color:#fff;border:1px solid #355175}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:12px;background:#1a3151;color:#fff;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#091629;border-radius:13px;padding:10px}.stat b{display:block;font-size:18px}.stat small{color:#9db0c5}.profile{display:flex;gap:12px;align-items:center}.avatar{font-size:38px;width:58px;height:58px;display:grid;place-items:center;background:#17304f;border-radius:16px}.game{position:fixed;inset:0;background:#0a1727;touch-action:none}.arena{position:absolute;inset:0;background:linear-gradient(135deg,#132c45,#08121f)}.obj{position:absolute;transform:translate(-50%,-50%);font-size:38px;user-select:none}.me{filter:drop-shadow(0 0 8px #44e2a8);z-index:5}.hunter{filter:drop-shadow(0 0 8px #ffc857);z-index:4}.hud{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.hudtop{display:flex;justify-content:space-between}.tag{background:#07101ddd;border:1px solid #294361;border-radius:12px;padding:9px;font-weight:800}.controls{display:flex;justify-content:space-between;align-items:end}.stick{width:120px;height:120px;border-radius:50%;background:#07101dbb;border:2px solid #ffffff33;pointer-events:auto;position:relative}.knob{width:54px;height:54px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff66;position:absolute;left:31px;top:31px}.actions{display:grid;grid-template-columns:85px 85px;gap:8px;pointer-events:auto}.act{height:68px;border-radius:18px;border:1px solid #355175;background:#10203add;color:#fff;font-weight:900}.act.green{background:#174a3e}.act.power{background:#443464}.toast{position:absolute;top:15%;left:50%;transform:translateX(-50%);background:#06111ee8;border:1px solid #375779;border-radius:99px;padding:9px 14px;z-index:20}.overlay{position:absolute;inset:0;background:#06111eec;display:grid;place-items:center;padding:20px;z-index:30}.result{max-width:390px;width:100%;text-align:center}.result .big{font-size:70px}.avatars{display:flex;flex-wrap:wrap;gap:8px}.av{font-size:25px;width:46px;height:46px;border-radius:12px;border:1px solid #355175;background:#10203a}.selected{outline:2px solid #44e2a8}.input{width:100%;padding:13px;border-radius:12px;background:#071425;border:1px solid #355175;color:#fff;font-size:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app"></div><script>
const A=document.getElementById('app'),S={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let p=S.get('ca_profile',{name:'Jogador',avatar:'🦊',xp:0,points:0,wins:0,games:0,coins:500}),mode='classic',hero='flash',g=null,raf=null,timer=null;
const M={classic:{n:'Clássico',i:'📦',d:'Transforme-se em objetos e sobreviva aos caçadores.',props:['📦','🪑','🪴','🛢️','🧰','🗑️','🧯','🪣']},biblical:{n:'Jornada Bíblica',i:'🕊️',d:'Vila antiga, objetos históricos e desafios de camuflagem.',props:['🏺','🧺','🌾','🐑','🪵','🫙','🪔','🧱']},heroes:{n:'Heróis Originais',i:'⚡',d:'Heróis próprios com poderes especiais e cenário futurista.',props:['🛰️','🔋','🧪','📡','💡','🧰','🗄️','🛸']}};
const H={flash:['Veloz','⚡','Impulso'],shield:['Guardião','🛡️','Escudo'],blink:['Salto','✨','Passo-Luz'],decoy:['Eco','🎭','Isca']};
function stop(){if(raf)cancelAnimationFrame(raf);if(timer)clearInterval(timer);raf=timer=null;g=null} function level(){return Math.floor(p.xp/250)+1}
function home(){stop();A.innerHTML=`<main class=screen><div class=brand>🎭 Camuflagem Arena<div class=sub>Caça & camuflagem para celular</div></div><div class="card profile"><div class=avatar>${p.avatar}</div><div><b>${p.name}</b><div class=sub>Nível ${level()} • ${p.xp%250}/250 XP</div></div><button class=back style="margin-left:auto" onclick="profile()">✏️</button></div><div class=stats><div class=stat><b>${p.points}</b><small>PONTOS</small></div><div class=stat><b>${p.wins}</b><small>VITÓRIAS</small></div><div class=stat><b>${p.games}</b><small>PARTIDAS</small></div><div class=stat><b>${p.coins}</b><small>MOEDAS</small></div></div><div class=grid>${Object.entries(M).map(([k,m])=>`<div class="card mode" onclick="pick('${k}')"><div class=icon>${m.i}</div><h3>${m.n}</h3><div class=sub>${m.d}</div><button class=btn>Jogar</button></div>`).join('')}<div class="card mode"><div class=icon>🏆</div><h3>Ranking local</h3><div class=sub>Seu progresso fica salvo no aparelho.</div><button class="btn alt" onclick="ranking()">Ver ranking</button></div></div></main>`}
function profile(){let av=['🦊','🐯','🐼','🦁','🐸','🦉','🐲','🤖','🦄','🐺','🦅','🐙'];A.innerHTML=`<main class=screen><div class=top><button class=back onclick=home()>←</button><h2>Perfil</h2></div><div class=card><label>Nome</label><input class=input id=name maxlength=18 value="${p.name}"><h3>Avatar</h3><div class=avatars>${av.map(x=>`<button class="av ${x===p.avatar?'selected':''}" onclick="selAv('${x}',this)">${x}</button>`).join('')}</div><button class=btn onclick=saveP()>Salvar</button></div></main>`} function selAv(x,e){p.avatar=x;document.querySelectorAll('.av').forEach(v=>v.classList.remove('selected'));e.classList.add('selected')} function saveP(){p.name=document.getElementById('name').value.trim()||'Jogador';S.set('ca_profile',p);home()}
function ranking(){let r=[['Luna','🐲',6840],['Ravi','🦁',5620],['Maya','🦉',4990],[p.name,p.avatar,p.points]].sort((a,b)=>b[2]-a[2]);A.innerHTML=`<main class=screen><div class=top><button class=back onclick=home()>←</button><h2>Ranking</h2></div><div class=card>${r.map((x,i)=>`<p><b>#${i+1} ${x[1]} ${x[0]}</b> — ${x[2]} pts</p>`).join('')}</div></main>`}
function pick(k){mode=k;let m=M[k],heroes=k==='heroes'?`<h3>Escolha o herói</h3><div class=avatars>${Object.entries(H).map(([id,h])=>`<button class="av ${id===hero?'selected':''}" onclick="selHero('${id}',this)" title="${h[0]} - ${h[2]}">${h[1]}</button>`).join('')}</div>`:'';A.innerHTML=`<main class=screen><div class=top><button class=back onclick=home()>←</button><h2>${m.i} ${m.n}</h2></div><div class=card><p>${m.d}</p>${heroes}<button class=btn onclick=start()>▶ Iniciar partida</button><button class="btn alt" onclick="alert('Modo online: esta versão inclui a estrutura mobile. Para salas globais permanentes é necessário servidor dedicado.')">🌐 Salas online</button></div><div class=card><b>${k==='biblical'?'Modo respeitoso':'Regras'}</b><div class=sub>${k==='biblical'?'Objetos e ambientes inspirados em vilas antigas e no contexto bíblico, sem transformar figuras sagradas em combatentes.':'Você tem 15 segundos para se esconder. Sobreviva até o cronômetro terminar.'}</div></div></main>`} function selHero(id,e){hero=id;document.querySelectorAll('.av').forEach(v=>v.classList.remove('selected'));e.classList.add('selected')}
function start(){let m=M[mode];g={x:50,y:82,vx:0,vy:0,prop:p.avatar,lock:false,hide:15,time:90,power:0,shield:false,last:performance.now(),objs:Array.from({length:24},(_,i)=>({x:5+Math.random()*90,y:8+Math.random()*84,e:m.props[i%m.props.length]})),hun:[{x:10,y:12,tx:70,ty:60,s:4},{x:90,y:30,tx:30,ty:70,s:3.7},{x:50,y:8,tx:80,ty:80,s:3.9}]};A.innerHTML=`<div class=game><div class=arena>${g.objs.map((o,i)=>`<div class=obj id=o${i} style="left:${o.x}%;top:${o.y}%">${o.e}</div>`).join('')}${g.hun.map((h,i)=>`<div class="obj hunter" id=h${i}>🔦</div>`).join('')}<div class="obj me" id=me>${g.prop}</div></div><div class=hud><div class=hudtop><div class=tag>${m.i} ${m.n}</div><div class=tag id=clock>ESCONDA-SE 15s</div></div><div class=controls><div class=stick id=stick><div class=knob id=knob></div></div><div class=actions><button class=act onclick=lock()>🔒<br>TRAVAR</button><button class="act green" onclick=transform()>✨<br>OBJETO</button>${mode==='heroes'?`<button class="act power" onclick=power()>${H[hero][1]}<br>PODER</button>`:''}${mode==='biblical'?`<button class="act power" onclick=light()>🕊️<br>LUZ</button>`:''}</div></div></div><div id=msg></div></div>`;stick();timer=setInterval(sec,1000);raf=requestAnimationFrame(frame)}
function sec(){if(!g)return;if(g.hide>0){g.hide--;document.getElementById('clock').textContent=`ESCONDA-SE ${g.hide}s`;if(g.hide===0)toast('🔦 Caçadores soltos!')}else{g.time--;document.getElementById('clock').textContent=`${Math.floor(g.time/60)}:${String(g.time%60).padStart(2,'0')}`;if(g.time<=0)end(true)}}
function frame(n){if(!g)return;let dt=Math.min(.05,(n-g.last)/1000);g.last=n;if(!g.lock){g.x=Math.max(2,Math.min(98,g.x+g.vx*dt*24));g.y=Math.max(4,Math.min(96,g.y+g.vy*dt*24))}if(g.power>0)g.power=Math.max(0,g.power-dt);if(g.hide<=0){g.hun.forEach((h,i)=>{let tx=g.lock?h.tx:g.x,ty=g.lock?h.ty:g.y,dx=tx-h.x,dy=ty-h.y,l=Math.hypot(dx,dy)||1;if(Math.hypot(h.tx-h.x,h.ty-h.y)<4){h.tx=5+Math.random()*90;h.ty=7+Math.random()*86}h.x+=dx/l*h.s*dt;h.y+=dy/l*h.s*dt;let e=document.getElementById('h'+i);e.style.left=h.x+'%';e.style.top=h.y+'%';if(Math.hypot(g.x-h.x,g.y-h.y)<5){if(g.shield){g.shield=false;h.x-=12;h.y-=12;toast('🛡️ Escudo salvou você')}else end(false)}})}let me=document.getElementById('me');if(me){me.style.left=g.x+'%';me.style.top=g.y+'%';me.textContent=g.prop}raf=requestAnimationFrame(frame)}
function transform(){if(!g)return;let b=null,d=999;g.objs.forEach(o=>{let q=Math.hypot(o.x-g.x,o.y-g.y);if(q<d){d=q;b=o}});if(d<13){g.prop=b.e;g.lock=false;toast('✨ Transformado!')}else toast('Chegue mais perto de um objeto')} function lock(){if(!g)return;g.lock=!g.lock;g.vx=g.vy=0;toast(g.lock?'🔒 Camuflagem travada':'🔓 Movimento liberado')}
function power(){if(!g||g.power>0)return;g.power=15;if(hero==='flash'){g.y=Math.max(4,g.y-15);toast('⚡ Impulso!')}if(hero==='shield'){g.shield=true;toast('🛡️ Escudo ativo')}if(hero==='blink'){g.x=Math.min(96,g.x+15);toast('✨ Passo-Luz!')}if(hero==='decoy'){g.hun.forEach(h=>{h.tx=Math.random()*90+5;h.ty=Math.random()*85+5});toast('🎭 Isca lançada!')}} function light(){if(!g||g.power>0)return;g.power=18;g.hun.forEach(h=>{h.tx=5+Math.random()*90;h.ty=5+Math.random()*90});toast('🕊️ Luz desviou os caçadores')}
function end(win){if(!g)return;p.games++;p.points+=win?300:60;p.xp+=win?120:35;p.coins+=win?100:20;if(win)p.wins++;S.set('ca_profile',p);stop();A.innerHTML=`<div class=game><div class=overlay><div class="card result"><div class=big>${win?'🏆':'🎯'}</div><h1>${win?'Você sobreviveu!':'Você foi encontrado'}</h1><p class=sub>${win?'+300 pontos • +120 XP • +100 moedas':'+60 pontos • +35 XP • +20 moedas'}</p><button class=btn onclick="pick('${mode}')">Jogar novamente</button><button class="btn alt" onclick=home()>Menu</button></div></div></div>`}
function toast(x){let e=document.getElementById('msg');if(!e)return;e.className='toast';e.textContent=x;clearTimeout(e.t);e.t=setTimeout(()=>e.className='',1500)} function stick(){let s=document.getElementById('stick'),k=document.getElementById('knob'),on=false;const mv=e=>{if(!on||!g||g.lock)return;let r=s.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy)||1,m=r.width*.32;if(l>m){dx=dx/l*m;dy=dy/l*m}k.style.transform=`translate(${dx}px,${dy}px)`;g.vx=dx/m;g.vy=dy/m};s.onpointerdown=e=>{on=true;s.setPointerCapture(e.pointerId);mv(e)};s.onpointermove=mv;s.onpointerup=s.onpointercancel=()=>{on=false;k.style.transform='';if(g)g.vx=g.vy=0}}
window.home=home;window.profile=profile;window.selAv=selAv;window.saveP=saveP;window.ranking=ranking;window.pick=pick;window.selHero=selHero;window.start=start;window.lock=lock;window.transform=transform;window.power=power;window.light=light;home();
</script></body></html>
